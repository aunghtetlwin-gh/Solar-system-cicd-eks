name: solar-system-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: "22"
  IMAGE_NAME: aunghtetlwin/solar-system-app
  AWS_REGION: ap-southeast-1
  EKS_CLUSTER_NAME: solar-system-eks

jobs:
  unit-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results.xml

  code-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run coverage
        run: npm run coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 5

  docker:
    runs-on: ubuntu-latest
    needs:
      - unit-testing
      - code-coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image for test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Smoke test Docker image
        run: |
          docker run --name solar-system-app -d \
            -p 3000:3000 \
            --rm \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/live; then
              exit 0
            fi
            sleep 2
          done

          docker logs solar-system-app
          exit 1

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy-eks:
    if: github.event_name == 'push' && vars.ENABLE_EKS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    needs:
      - docker
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0

      - name: Configure EKS kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Apply Kubernetes manifests
        run: kubectl apply -f kubernetes/eks/

      - name: Deploy commit image
        run: |
          kubectl set image deployment/solar-system-app \
            solar-system-app="$IMAGE_NAME:$GITHUB_SHA" \
            --namespace solar-system

      - name: Wait for app rollout
        run: |
          kubectl rollout status deployment/solar-system-app \
            --namespace solar-system \
            --timeout=5m

      - name: Smoke test deployed app
        run: |
          for i in {1..60}; do
            ADDRESS=$(kubectl get ingress solar-system-app \
              --namespace solar-system \
              --output jsonpath='{.status.loadBalancer.ingress[0].hostname}')

            if [ -n "$ADDRESS" ] && curl -fsS "http://$ADDRESS/live"; then
              exit 0
            fi

            sleep 10
          done

          kubectl get all --namespace solar-system
          exit 1
