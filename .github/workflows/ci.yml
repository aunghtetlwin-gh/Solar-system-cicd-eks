name: solar-system-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: "22"
  IMAGE_NAME: aunghtetlwin/solar-system-app

jobs:
  unit-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results.xml

  code-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run coverage
        run: npm run coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 5

  docker:
    runs-on: ubuntu-latest
    needs:
      - unit-testing
      - code-coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image for test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Smoke test Docker image
        run: |
          docker run --name solar-system-app -d \
            -p 3000:3000 \
            --rm \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3000/live; then
              exit 0
            fi
            sleep 2
          done

          docker logs solar-system-app
          exit 1

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  update-gitops-dev:
    if: github.event_name == 'push' && vars.ENABLE_GITOPS_UPDATE == 'true' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    needs:
      - docker

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Update dev overlay image tag
        run: |
          sed -i -E "s|newTag: .*|newTag: ${GITHUB_SHA}|" \
            kubernetes/overlays/dev/kustomization.yaml

      - name: Commit dev overlay update
        run: |
          if git diff --quiet kubernetes/overlays/dev/kustomization.yaml; then
            echo "Dev overlay already uses this image tag."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/overlays/dev/kustomization.yaml
          git commit -m "Update dev image to ${GITHUB_SHA} [skip ci]"
          git push
