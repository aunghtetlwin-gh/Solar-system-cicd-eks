apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: solar-system-dev
  namespace: argocd
spec:
  project: solar-system
  source:
    repoURL: https://github.com/aunghtetlwin-gh/Solar-system-cicd-eks.git
    targetRevision: main
    path: kubernetes/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: solar-system-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
